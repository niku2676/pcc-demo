name: proof-carrying-code

on:
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: hosbe1/Proof-Carrying-Code-Meta-AI-Hackathon-2026@main
        with:
          meta-api-key: ${{ secrets.META_API_KEY }}
